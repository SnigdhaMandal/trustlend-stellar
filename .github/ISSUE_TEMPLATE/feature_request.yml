name: Feature Request
description: Suggest an idea or feature enhancement for TrustLend.
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component/Area
      description: Which area of the project is this feature for?
      options:
        - Smart Contracts
        - Frontend
        - API/Backend
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Context
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context / Screenshots
      description: Add any other context or mockups about the feature request here.
    validations:
      required: false
