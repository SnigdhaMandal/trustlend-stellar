name: Bug Report
description: File a report to help us reproduce and fix a bug.
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component/Area
      description: Which area of the project does this bug affect?
      options:
        - Smart Contracts
        - Frontend
        - API/Backend
        - Documentation
        - CI/DevOps
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Description / Summary
      description: Provide a clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Please provide detailed steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected Behavior vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: What OS, Browser, Wallet, Node/Rust version are you using?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Screenshots / Additional Context
      description: Add any other context or screenshots about the bug here.
    validations:
      required: false
